name: Actualizar tasas
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/actualizar.mjs
        env:
          ELTOQUE_TOKEN: ${{ secrets.ELTOQUE_TOKEN }}
      - name: Guardar si cambió
        run: |
          git config user.name "tasas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tasas.json
          git diff --staged --quiet || (git commit -m "Actualizar tasas" && git push)
